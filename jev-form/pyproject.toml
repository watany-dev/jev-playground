[project]
name = "jev-form"
version = "0.1.0"
description = "47都道府県当てクイズで Jev の型付き確率評価を試すサンプルフォーム"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "python-multipart>=0.0.32",
    "uvicorn>=0.34",
]

[project.scripts]
jev-form = "jev_form.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_form"]

[tool.pytest.ini_options]
testpaths = ["tests"]
